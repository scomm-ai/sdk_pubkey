name: secmail_pubkey_sdk
description: SComm pubkey protocol adapter. Canonicalization uses the CKVF Dart library.
version: 2.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  dio: ^5.7.0
  ristretto255: ^1.0.2
  unorm_dart: ^0.3.0
  ckvf:
    git:
      url: https://github.com/scomm-public/ckvf.git
      ref: 448e72489e803f9c0b879cc9c9240ea530418eff
      path: packages/dart
  scomm_vault_client:
    path: packages/scomm_vault_client

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  scomm_openpgp:
    path: ../scomm-openpgp/dart/scomm_openpgp
  scomm_smime:
    path: ../scomm-smime/dart/scomm_smime

dependency_overrides:
  scomm_openpgp:
    path: ../scomm-openpgp/dart/scomm_openpgp
