name: secmail_pubkey_sdk
description: SComm pubkey protocol adapter. Canonicalization uses the CKVF Rust library.
version: 1.2.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.4
  cryptography: ^2.7.0
  dio: ^5.7.0
  ristretto255: ^1.0.2
  unorm_dart: ^0.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
