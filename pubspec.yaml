name: secmail_pubkey_sdk
description: High-level Dart SDK for the scomm-ai pubkey server API (dio). Uses secmail_crypto_sdk for signing and blobs.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  dio: ^5.7.0
  secmail_crypto_sdk:
    # path: ../crypto
    # path: ../../fl-start/crypto
    git:
      url: https://github.com/fl-start/crypto.git
      ref: afb7b7a704e01152f6ccb75639e8bedffa3aecfb
  uuid: ^4.5.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
