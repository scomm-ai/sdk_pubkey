[package]
name = "scomm-discovery"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Discovery client. Mailbox locator is unsalted SHA-256. No OPRF."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
