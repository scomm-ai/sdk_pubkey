[package]
name = "scomm-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SComm discovery directory + mailer HTTP client. Mailbox locator is unsalted SHA-256."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
# Native: reqwest + rustls (preferred). Use `--features native-tls-backend`
# instead of default when ring/clang is unavailable.
native = ["rustls-backend", "dep:tokio"]
rustls-backend = ["reqwest/rustls-tls"]
native-tls-backend = ["reqwest/native-tls", "dep:tokio"]
# Browser: reqwest uses the wasm HTTP backend (no TLS crate).
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "getrandom/js"]

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
urlencoding = "2"
unicode-normalization = "0.1"
serde_json_canonicalizer = "0.3"
regex = "1"
once_cell = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = "0.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time"], optional = true }
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
rand = "0.8"
