[package]
name = "scomm-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SComm.AI vault-host client: KeyVault, pairing, identity OPRF, pepper POPRF."
publish = false

[lib]
name = "scomm_vault_client"
path = "src/lib.rs"

[features]
default = ["native"]
# Native TLS via SChannel (builds without clang/ring). Use `rustls` when a C toolchain is available.
native = ["native-tls"]
native-tls = ["reqwest/native-tls"]
# Prefer rustls when clang/MSVC can build `ring`.
rustls = ["reqwest/rustls-tls"]
# Browser: reqwest's wasm backend (no TLS crate).
wasm = ["getrandom/js"]

[dependencies]
ckvf = { git = "https://github.com/scomm-public/ckvf.git", rev = "47d7c7adb96078ae6164186dc14610f45e06d94a" }
async-trait = "0.1"
base64 = "0.22"
curve25519-dalek = { version = "4", features = ["alloc", "precomputed-tables", "zeroize", "rand_core"] }
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde_json = "1"
base64 = "0.22"
ckvf = { git = "https://github.com/scomm-public/ckvf.git", rev = "47d7c7adb96078ae6164186dc14610f45e06d94a" }
