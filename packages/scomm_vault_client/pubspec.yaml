name: scomm_vault_client
description: Scomm.AI vault client. Local-first CKVF key vault, device pairing, identity OPRF, pepper POPRF, and vault-host routes.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ckvf:
    git:
      url: https://github.com/scomm-public/ckvf.git
      ref: 448e72489e803f9c0b879cc9c9240ea530418eff
      path: packages/dart
  crypto: ^3.0.6
  cryptography: ^2.7.0
  pqcrypto: ^0.4.2
  dio: ^5.7.0
  ristretto255: ^1.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  scomm_openpgp:
    git:
      url: https://github.com/scomm-ai/scomm-openpgp.git
      ref: 389aeddbb191c72a5a4c75dee78756ce77d4891d
      path: dart/scomm_openpgp
