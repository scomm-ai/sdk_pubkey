version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  ckvf:
    git:
      url: https://github.com/scomm-public/ckvf.git
      ref: 026079a59dc0e56ab41b17ba73be4ae8a4ea698f
      path: packages/dart
  crypto: ^3.0.6
  dio: ^5.7.0
  ristretto255: ^1.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
