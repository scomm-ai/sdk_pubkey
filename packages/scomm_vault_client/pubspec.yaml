name: scomm_vault_client
description: Scomm.AI vault client. Local-first CKVF key vault, device pairing, identity OPRF, pepper POPRF, and vault-host routes.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  ckvf:
    git:
      url: https://github.com/scomm-public/ckvf.git
      ref: 47d7c7adb96078ae6164186dc14610f45e06d94a
      path: packages/dart
  crypto: ^3.0.6
  dio: ^5.7.0
  ristretto255: ^1.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
